<div class="menu-backdrop">
  @if (view() === 'main') {
    <div class="menu-panel">
      <h1>Kácení stromů</h1>
      <button type="button" (click)="onNewGameClick()">Nová hra</button>
      <button type="button" [disabled]="!hasSavedGame" (click)="onContinueClick()">
        Pokračovat
        @if (saveSummary) {
          <span class="subtitle">Pokáceno stromů: {{ saveSummary.treesChoppedCount }}</span>
        }
      </button>
      <button type="button" (click)="onSettingsClick()">Nastavení</button>
    </div>
  }

  @if (view() === 'settings') {
    <div class="menu-panel">
      <h2>Nastavení</h2>
      <label class="setting-row">
        Citlivost rozhlížení
        <input
          type="range"
          min="0.1"
          max="2"
          step="0.1"
          [value]="settings.lookSensitivity()"
          (input)="onSensitivityInput($event)"
        />
        <span class="setting-value">{{ settings.lookSensitivity() }}</span>
      </label>
      <button type="button" (click)="onBackClick()">Zpět</button>
    </div>
  }
</div>
