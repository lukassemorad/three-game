<div class="crosshair"></div>

<div class="damage-vignette" [style.opacity]="flashOpacity()"></div>

@if (lookTarget(); as target) {
  <div class="interact-prompt">
    <span class="label">{{ target.label }}</span>
    @if (target.interactPrompt) {
      <span class="hint">{{ target.interactPrompt }}</span>
    }
  </div>
}

<div class="stat-bar">
  <div class="stat">
    <span class="icon">🪙</span>
    <span class="value">{{ money() }}</span>
  </div>
</div>
