<div class="scene-container">
  <canvas #canvas class="game-canvas"></canvas>

  @if (threeScene.locked()) {
    <app-hud />
  }

  @if (!threeScene.locked()) {
    <div class="start-overlay" (click)="onStartClick()">
      <p>Klikni pro start</p>
      <p class="hint">WASD pohyb · myš rozhlížení · Esc uvolní kurzor</p>
    </div>
  }
</div>
